name: Build and Release

on:
  push:
    tags:
      - 'v*' # Otomatis jalan saat tag rilis dibuat, contoh: v2.1.1
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target Tag or Commit to build (e.g. v3.0.0). Leave empty to use current commit.'
        required: false
        default: ''

permissions:
  contents: write # Dibutuhkan untuk membuat GitHub Release dan upload asset

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path $innoPath)) {
            $innoPath = "C:\Program Files\Inno Setup 7"
          }
          if (-not (Test-Path $innoPath)) {
            $innoPath = "C:\Program Files\Inno Setup 6"
          }
          Write-Host "Inno Setup path: $innoPath"
          "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download FFmpeg Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "resources/bin"
          if (-not (Test-Path "resources/bin/ffmpeg.exe")) {
            Write-Host "Downloading FFmpeg for Windows..."
            $ffmpegZip = Join-Path $env:TEMP "ffmpeg.zip"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ffmpegZip
            Expand-Archive -Path $ffmpegZip -DestinationPath (Join-Path $env:TEMP "ffmpeg_extracted") -Force
            $binFolder = Get-ChildItem -Path (Join-Path $env:TEMP "ffmpeg_extracted") -Recurse -Filter "ffmpeg.exe" | Select-Object -ExpandProperty DirectoryName
            Copy-Item -Path (Join-Path $binFolder "ffmpeg.exe") -Destination "resources/bin/ffmpeg.exe" -Force
            Copy-Item -Path (Join-Path $binFolder "ffprobe.exe") -Destination "resources/bin/ffprobe.exe" -Force
            Write-Host "FFmpeg binaries placed in resources/bin successfully!"
          }

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Electron
        run: npm run build

      - name: Package Electron App (Unpacked)
        run: node build_unpacked.js

      - name: Create Portable ZIP Package
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $portableZip = "release/Convertin-v$ver-Portable-win-x64.zip"
          Write-Host "Creating portable archive: $portableZip"
          Compress-Archive -Path "release\win-unpacked\*" -DestinationPath $portableZip -CompressionLevel Optimal -Force
          Write-Host "Portable archive created successfully!"

      - name: Generate Official Store & Tile Assets
        run: |
          if (Test-Path "generate_appx_assets.mjs") {
            node generate_appx_assets.mjs
          }

      - name: Build MSIX / APPX Package for Microsoft Store
        run: npx electron-builder --win appx

      - name: Compile Installer with Inno Setup
        shell: pwsh
        run: |
          # Mengompilasi installer.iss ke release/installer/Convertin-Setup-x64.exe
          iscc installer.iss

      - name: Upload Unsigned Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Convertin-Setup-Installer
          path: release/installer/Convertin-Setup-*.exe

      - name: Upload Store MSIX Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Convertin-Store-MSIX
          path: release/*.appx

      - name: Upload Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Convertin-Portable-ZIP
          path: release/Convertin-*-Portable-win-x64.zip

      - name: Determine Release Tag
        id: rel_tag
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.target_tag }}".Trim()
          if ($inputTag -ne "") {
            $tag = $inputTag
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $ver = (Get-Content package.json | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          Write-Host "Resolved release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or Update GitHub Release & Upload Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_tag.outputs.tag }}
          files: |
            release/installer/Convertin-Setup-*.exe
            release/*.appx
            release/Convertin-*-Portable-win-x64.zip
          name: Convertin ${{ steps.rel_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
